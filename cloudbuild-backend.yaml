substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: windows-event-log-analyzer
  _BACKEND_SERVICE: windows-event-log-api

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/api:$COMMIT_SHA
      - --file
      - backend/Dockerfile.cloudrun
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/api:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --cpu=2
      - --memory=2Gi
      - --concurrency=1
      - --max=3
      - --timeout=900

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/api:$COMMIT_SHA
