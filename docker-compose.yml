services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - event-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"

volumes:
  event-uploads:
